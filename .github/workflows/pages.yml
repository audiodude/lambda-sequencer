name: Deploy released index.html to Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to deploy (defaults to latest release)
        required: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            REF="${{ github.event.release.tag_name }}"
          else
            REF=$(gh release view --json tagName -q .tagName -R "$GITHUB_REPOSITORY")
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: src

      - name: Build gh-pages tree
        run: |
          mkdir site
          cp src/index.html site/index.html

      - name: Push to gh-pages
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy $REF"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages
