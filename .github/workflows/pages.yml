name: Deploy released index.html to Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to deploy (defaults to latest release)
        required: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        run: |
          REF="${{ inputs.ref }}"
          [ -z "$REF" ] && REF="${{ github.event.release.tag_name }}"
          if [ -z "$REF" ]; then
            echo "::error::No ref provided. Trigger this via release: published, or pass an explicit ref to workflow_dispatch."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: src

      - name: Build gh-pages tree
        run: |
          mkdir site
          # Stamp the exact released commit into the header as v_<hash>
          # (matches the release tag). The local post-commit hook can only
          # approximate this — a commit can't contain its own hash.
          HASH=$(git -C src rev-parse --short HEAD)
          sed -E "s|<span class=\"commit-hash\">[^<]*</span>|<span class=\"commit-hash\">v_$HASH</span>|" \
            src/index.html > site/index.html
          grep -q "commit-hash\">v_$HASH<" site/index.html
          echo 'lambda.audiodude.xyz' > site/CNAME

      - name: Push to gh-pages
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html CNAME
          git commit -m "Deploy $REF"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages
